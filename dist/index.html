<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe9dc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="墨の島、紙の舟。指で引いて放すたび、あなただけの航路が生まれる。8つの海を渡る、静かなアートゲーム。">
  <title>余白航路 — MARGIN TIDE</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./ink.css?v=1.1.0">
  <script>if(['terminal.local','localhost','127.0.0.1'].includes(location.hostname)&&'serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>Promise.all(r.map(x=>x.unregister()))).catch(()=>{});</script>
</head>
<body>
<main id="app">
  <canvas id="sea" tabindex="0" role="img" aria-label="余白航路。墨の島と紙の舟の海。"></canvas>
  <section id="title" aria-label="タイトル">
    <div class="edition"><span class="small-rule"></span> A PLAYABLE INKSCAPE <span class="edition-number">N° 06</span></div>
    <div class="title-copy">
      <p class="eyebrow">余白に、風を。</p>
      <h1>余白航路</h1>
      <p class="roman-title">MARGIN TIDE</p>
      <p class="intro">墨の島、紙の舟。<br>あなたの指先から、航路が生まれる。</p>
      <div class="title-actions">
        <button id="begin" class="primary" disabled><span id="beginText">海をひらいています</span><span aria-hidden="true">↗</span></button>
        <div class="sub-actions"><button id="logbook" class="text-button">航海帖 <span aria-hidden="true">＋</span></button><button id="gallery" class="text-button">作品集</button><button id="how" class="text-button">遊び方</button></div>
      </div>
      <p id="continueNote" class="continue-note">八つの海を、ひとつずつ。</p>
    </div>
    <footer class="title-footer"><span>01 — 08 <i></i> THE LIVING PAPER · v1.1</span><span>舟で描き、墨を金に。</span></footer>
  </section>
  <nav id="artUI" hidden aria-label="航路作品の操作"><button id="backFromArt" class="text-button">← 航海へ戻る</button><button id="pinArt" class="text-button">作品集に記録</button><button id="saveArt" class="art-save">画像を保存 ↗</button></nav>
  <section id="gameUI" hidden aria-label="航海の操作">
    <header class="game-header">
      <button id="chapterButton" class="chapter-button" aria-label="航海帖を開く"><span id="chapterNumber">01</span><span class="chapter-divider"></span><span><span id="chapterName">はじまりの波</span><small id="chapterEnglish">A FIRST RIPPLE</small></span></button>
      <div id="lamps" class="lamp-counter" role="status" aria-label="灯 0 / 3"></div>
      <div class="header-actions"><button id="audioButton" class="icon-button" aria-label="音を消す" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h4l5-4v12l-5-4H4zM16 8q5 4 0 8M18 5q8 7 0 14"/></svg></button><button id="pauseButton" class="icon-button" aria-label="一時停止"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button></div>
    </header>
    <footer class="game-footer"><span id="strokeCounter"><strong>00</strong> ひと漕ぎ</span><span id="hint">指を引いて、放す。灯を集めて港へ。</span><button id="retryButton" class="text-button" aria-label="この海を最初からやり直す">やり直す <span aria-hidden="true">↺</span></button></footer>
    <div id="firstGesture" aria-hidden="true"><span class="gesture-dot"></span><span class="gesture-line"></span><span>どこからでも、引いて放す</span></div>
  </section>
  <p id="toast" role="status" aria-live="polite" hidden></p>
  <dialog id="panel" aria-labelledby="panelTitle"><div id="panelContent"></div></dialog>
  <dialog id="exportPanel" aria-labelledby="exportHeading"><div class="export-sheet"><div class="panel-heading"><h2 id="exportHeading">航路を一枚に。</h2><button id="closeExport" class="close-button" aria-label="画像の保存画面を閉じる">×</button></div><img id="exportPreview" alt="保存する航路作品"><div class="export-actions"><a id="downloadArt" class="art-save" download="margin-tide.png">PNGを保存 ↗</a><button id="shareArt" class="text-button" hidden>共有する</button><p>iPhoneでは画像を長押しして<br>保存することもできます。</p></div></div></dialog>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript>余白航路を遊ぶには、ブラウザーのJavaScriptを有効にしてください。</noscript>
</main>
<script type="module" src="./app.mjs?v=1.1.0"></script>
</body>
</html>
