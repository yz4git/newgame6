<!doctype html><html lang="ja"><meta charset="utf-8"><title>余白航路 · 画面確認</title><style>body{margin:0;background:#ddd9ce;color:#203b43;font:12px sans-serif}header{height:42px;display:flex;align-items:center;gap:12px;padding:0 12px}button{padding:6px 10px;color:inherit;background:#efe9dc;border:1px solid #a9ad9d}iframe{border:0;display:block}</style><header>余白航路 · 画面確認 <button id="landscape">844 × 390</button><button id="portrait">390 × 844</button><button id="safe">iPhone safe area</button><button id="painting">金継ぎの航路を生成</button><span id="qaStatus"></span></header><iframe title="iPhone画面のゲーム" src="./" width="844" height="390" allow="autoplay;fullscreen"></iframe><script>
const frame=document.querySelector('iframe');document.querySelector('#landscape').onclick=()=>{frame.width=844;frame.height=390;};document.querySelector('#portrait').onclick=()=>{frame.width=390;frame.height=844;};let safe=false;document.querySelector('#safe').onclick=()=>{safe=!safe;const style=frame.contentDocument.documentElement.style;for(const [key,value]of Object.entries({'--safe-l':safe?'44px':'0px','--safe-r':safe?'44px':'0px','--safe-b':safe?'21px':'0px'}))style.setProperty(key,value);frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('resize'));};
</script>
<script type="module">
// Local visual fixture: a real sequence of launches through the shipped 120Hz model.
import {Voyage} from './model.mjs?v=1.1.0';import {makePrint} from './prints.mjs?v=1.1.0';import {Logbook} from './storage.mjs?v=1.1.0';
document.querySelector('#painting').onclick=()=>{const g=new Voyage();Object.assign(g.boat,{x:795,y:475});g.path=[{x:795,y:475,move:true,weight:.3}];g.safe={x:795,y:475};const factor=1.65/(1-Math.exp(-1.65*.35));for(let i=1;i<=16;i++){const angle=i/16*Math.PI*2;g.launch({x:(630+165*Math.cos(angle)-g.boat.x)*factor,y:(475+113*Math.sin(angle)-g.boat.y)*factor});for(let tick=0;tick<42;tick++)g.step(1/120);}for(const target of [...g.level.lights,g.level.goal]){g.launch({x:(target.x-g.boat.x)*1.72,y:(target.y-g.boat.y)*1.72});for(let tick=0;tick<480;tick++)g.step(1/120);}const store=new Logbook(localStorage);store.finish(0,{shots:g.shots,tears:g.tears,medals:g.medals()},makePrint(g));document.querySelector('#qaStatus').textContent=`モデルで生成: ${g.shots} 漕ぎ・金継ぎ ${g.stitched.filter(Boolean).length}`;document.querySelector('iframe').src='./';};
</script>

</html>
