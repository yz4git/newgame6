<!doctype html><html lang="ja"><meta charset="utf-8"><title>余白航路 · 画面確認</title><style>body{margin:0;background:#ddd9ce;color:#203b43;font:12px sans-serif}header{height:42px;display:flex;align-items:center;gap:12px;padding:0 12px}button{padding:6px 10px;color:inherit;background:#efe9dc;border:1px solid #a9ad9d}iframe{border:0;display:block}</style><header>余白航路 · 画面確認 <button id="landscape">844 × 390</button><button id="portrait">390 × 844</button><button id="safe">iPhone safe area</button></header><iframe title="iPhone画面のゲーム" src="./" width="844" height="390" allow="autoplay;fullscreen"></iframe><script>
const frame=document.querySelector('iframe');document.querySelector('#landscape').onclick=()=>{frame.width=844;frame.height=390;};document.querySelector('#portrait').onclick=()=>{frame.width=390;frame.height=844;};let safe=false;document.querySelector('#safe').onclick=()=>{safe=!safe;const style=frame.contentDocument.documentElement.style;for(const [key,value]of Object.entries({'--safe-l':safe?'44px':'0px','--safe-r':safe?'44px':'0px','--safe-b':safe?'21px':'0px'}))style.setProperty(key,value);frame.contentWindow.dispatchEvent(new frame.contentWindow.Event('resize'));};
</script></html>
