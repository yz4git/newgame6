<!doctype html><html><meta charset="utf-8"><title>Lumen Wing / responsive QA</title><style>body{margin:0;background:#333;color:#fff;font:12px sans-serif}nav{height:50px;display:flex;gap:10px;align-items:center;padding:0 20px}button{padding:8px}iframe{display:block;border:0;width:844px;height:390px;margin:20px;box-shadow:0 0 0 1px #777}body.portrait iframe{width:390px;height:844px}#reading{margin:10px 20px;white-space:pre-wrap;max-width:1000px}</style><nav><button id="landscape">iPhone 横 844 × 390</button><button id="portrait">iPhone 縦 390 × 844</button><button id="inspect">配置と入力の状態を読む</button></nav><iframe id="phone" src="./_qa-game.html" title="iPhone game"></iframe><pre id="reading"></pre><script>const phone=document.getElementById('phone'); document.getElementById('landscape').onclick=()=>{document.body.className='';};document.getElementById('portrait').onclick=()=>{document.body.className='portrait';};document.getElementById('inspect').onclick=()=>{const d=phone.contentDocument;let items=[...d.querySelectorAll('button,h1,h2,.hero,.title-footer')].filter(e=>e.getBoundingClientRect().width>0).map(e=>{let r=e.getBoundingClientRect();return {text:e.textContent.trim().slice(0,55),x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),inside:r.x>=0&&r.y>=0&&r.right<=phone.clientWidth+1&&r.bottom<=phone.clientHeight+1}});document.getElementById('reading').textContent=JSON.stringify({viewport:[phone.clientWidth,phone.clientHeight],sky:d.getElementById('sky').dataset,items},null,2);};</script></html>
<script type="module">
const bar=document.querySelector('nav');for (const [id,text] of [['combat','戦闘 60秒から'],['gate','火山宙域'],['gate2','機械宙域'],['gate3','終端宙域'],['upgrade','成長画面'],['evolve','進化補給箱'],['boss','ボス直前から'],['dead','リザルト'],['won','クリア'],['reset','検証記録を初期化']]) {const b=document.createElement('button');b.textContent=text;b.id=id;b.onclick=()=>document.getElementById('phone').contentWindow.postMessage({wingQA:id},location.origin);bar.append(b);}
</script>
