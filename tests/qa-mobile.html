<!doctype html><html lang="ja"><meta charset="utf-8"><title>NOCTURNE v2 · Mobile QA</title><style>body{margin:0;background:#181d27;color:#c8c0aa;font:13px sans-serif}header{height:48px;display:flex;align-items:center;gap:12px;padding:0 12px}button{background:#303b50;border:1px solid #6f7791;color:#e6d6b8;padding:5px 10px}iframe{border:0;display:block}</style><header>iPhone landscape · 844×390 <button id="fresh">Fresh journey</button><button id="chapel">Chapel / 650 souls</button><button id="archive">Archive / enemies</button><button id="sanctum">Boss approach</button><button id="portrait">Portrait</button><span id="status"></span></header><iframe title="iPhone横画面テスト" src="./" width="844" height="390" allow="autoplay;fullscreen"></iframe><script type="module" src="./_qa-input.js"></script><script type="module">
import {freshProgress} from './model.mjs?v=2.1.0';import {SaveStore,SAVE_KEY,BACKUP_KEY} from './storage.mjs?v=2.1.0';const store=new SaveStore(localStorage),frame=document.querySelector('iframe');
function preset(room){frame.src='about:blank';setTimeout(()=>{const p=freshProgress();p.room=room;p.x=room===1?340:room===2?600:270;p.y=590;p.checkpoint={room,x:p.x,y:p.y};if(room){p.gold=650;p.level=3;p.shrines=[0,1,2,3,4];p.visited=[0,1,2,3,4];p.lore=['arrival','covenant'];}if(room===4){p.seals=['tide','bell'];p.wardens=['tide','bell'];p.relic=true;p.upgrades={edge:2,focus:1,vitality:1};}store.save(p);frame.src='./';document.querySelector('#status').textContent='Preset ready';},150);}
document.querySelector('#fresh').onclick=()=>preset(0);document.querySelector('#chapel').onclick=()=>preset(1);document.querySelector('#archive').onclick=()=>preset(2);document.querySelector('#sanctum').onclick=()=>preset(4);document.querySelector('#portrait').onclick=()=>{const vertical=frame.width==='844';frame.width=vertical?'390':'844';frame.height=vertical?'844':'390';};
</script></html>
