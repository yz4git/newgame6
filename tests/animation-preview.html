<!doctype html><html lang="ja"><meta charset="utf-8"><title>NOCTURNE · Animation QA</title><style>body{margin:0;background:#101725;color:#dfd1b1;font:14px sans-serif}header{display:flex;gap:12px;align-items:center;padding:16px}button,select,input{font:inherit;color:inherit;background:#25364d;border:1px solid #77869a;padding:7px}canvas{display:block;width:min(100%,1200px);height:auto}#status{padding:10px 18px;color:#b2c4da}</style><header><label>動作 <select id="mode"><option value="attack">ムチ</option><option value="run">走る</option><option value="idle">待機</option><option value="jump">跳躍</option><option value="dash">回避</option></select></label><label>向き <select id="direction"><option value="1">右</option><option value="-1">左</option></select></label><button id="play">一時停止</button><button id="step">次のコマ</button><label>位相 <input id="phase" type="range" min="1" max="99" value="46"></label><label><input id="sockets" type="checkbox">接続点</label></header><canvas id="canvas" width="1200" height="440"></canvas><div id="status">読み込み中</div><script type="module">
import {Renderer} from './render.mjs?v=2.2.0';import {GameModel} from './model.mjs?v=2.2.0';import {heroPose,posePoint,whipForPlayer} from './animation.mjs?v=2.2.0';
const assets={};await Promise.all(['cathedral','crypt','belfry','sanctum','hero','enemies','props','motion','hunters','attack'].map(name=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>{assets[name]=image;resolve();};image.onerror=reject;image.src='./assets/'+name+'.webp';})));const atlas=await(await fetch('./assets/atlas.json?v=2.2.0')).json();const canvas=document.querySelector('#canvas'),renderer=new Renderer(canvas,assets,atlas);canvas.width=1200;canvas.height=440;const c=renderer.ctx,g=new GameModel();let playing=true,phase=.46,last=performance.now();
const mode=document.querySelector('#mode'),slider=document.querySelector('#phase');document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'一時停止':'再生';};slider.oninput=()=>{playing=false;phase=Number(slider.value)/100;document.querySelector('#play').textContent='再生';};document.querySelector('#step').onclick=()=>{playing=false;phase=(phase+.08)%1;slider.value=Math.round(phase*100);document.querySelector('#play').textContent='再生';};
function draw(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing){phase=(phase+dt*.7)%1;slider.value=Math.round(phase*100);}Object.assign(g.player,{x:300,y:350,vx:0,vy:0,grounded:true,attack:0,cast:0,dash:0,land:0,inv:0,hurt:0,anim:phase*2,dir:Number(document.querySelector('#direction').value)});const p=g.player;if(mode.value==='attack'){p.attackTotal=.36;p.attack=.36*(1-phase);}if(mode.value==='run'){p.vx=300;p.run=phase*8;}if(mode.value==='jump'){p.grounded=false;p.vy=phase<.5?-300:300;}if(mode.value==='dash')p.dash=.1;c.setTransform(1,0,0,1,0,0);c.fillStyle='#101725';c.fillRect(0,0,1200,440);c.strokeStyle='#43546b';c.beginPath();c.moveTo(0,350);c.lineTo(1200,350);c.stroke();c.save();c.translate(50,-192.5);c.scale(1.55,1.55);renderer.hero(g,phase*2);const pose=heroPose(p),w=whipForPlayer(p);if(document.querySelector('#sockets').checked){c.fillStyle='#80d5f3';const hand=pose.source.grip?posePoint(pose,pose.source.grip):{x:p.x,y:p.y};c.beginPath();c.arc(hand.x,hand.y,3,0,Math.PI*2);c.fill();c.strokeStyle='#afc3db';c.strokeRect(p.x-3,p.y-3,6,6);}c.restore();document.querySelector('#status').textContent=`${mode.value} · コマ ${pose.frame+1} · 位相 ${Math.round(phase*100)}% · ${w?.active?'当たり判定 ON':'当たり判定 OFF'}${w?' · 鎖 '+Math.round(w.length)+'px':''}`;requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
